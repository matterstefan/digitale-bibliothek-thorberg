name: Geprüften Bandvorschlag übernehmen

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: thorberg-edits
  cancel-in-progress: false

jobs:
  uebernehmen:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/übernehmen')
    runs-on: ubuntu-latest
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Änderung prüfen und vorbereiten
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPROVAL_COMMENT: ${{ github.event.comment.body }}
        run: python3 scripts/apply_issue.py
      - name: Geprüfte Änderung publizieren
        env:
          ISSUE_NUMBERS: ${{ steps.apply.outputs.issue_numbers }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daten.json index.html
          git diff --cached --exit-code && { echo 'Keine Änderungen vorhanden'; exit 1; } || true
          git commit -m "Banddaten aus Issues ${ISSUE_NUMBERS} übernehmen"
          git push
      - name: Freigegebene Issues schliessen
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBERS: ${{ steps.apply.outputs.issue_numbers }}
        run: |
          IFS=',' read -r -a numbers <<< "$ISSUE_NUMBERS"
          for issue in "${numbers[@]}"; do
            gh issue close "$issue" --reason completed --comment "Änderung geprüft und zusammen mit den weiteren freigegebenen Vorschlägen in den Datenbestand übernommen."
          done
